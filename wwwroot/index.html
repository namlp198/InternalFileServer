<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Internal File Server</title>
    <link rel="stylesheet" href="/site.css">
</head>
<body>
    <header id="appHeader"></header>

    <main>
        <section id="signedOutCard" class="card hidden">
            <div class="empty-state">
                <h2>Sign in to browse, upload and download files</h2>
                <div class="row-actions">
                    <a class="button" href="/login.html">Sign in</a>
                    <a class="button secondary" href="/register.html">Register</a>
                </div>
            </div>
        </section>

        <div id="appContent" class="dashboard-content hidden">
        <section class="card">
            <div class="card-header">
                <h2>Upload</h2>
                <button type="button" id="refreshBtn" class="secondary">Refresh</button>
            </div>
            <div class="upload-controls">
                <div class="field">
                    <label for="uploadPath">Upload to</label>
                    <select id="uploadPath"></select>
                </div>
            </div>

            <div id="dropZone" class="upload-zone" role="button" tabindex="0">
                <div>
                    <p class="upload-title">Drop files here or click to choose</p>
                    <p class="upload-note">Signed-in users can upload and download. Only admins can delete files.</p>
                </div>
                <input id="fileInput" type="file" multiple>
            </div>
            <div id="uploadStatus"></div>
        </section>

        <section class="card">
            <div class="actions">
                <div class="field">
                    <label for="folderFilter">Folder</label>
                    <select id="folderFilter"></select>
                </div>
                <input id="searchInput" type="search" placeholder="Search by file name" aria-label="Search by file name">
                <span id="fileCount" class="muted">Loading...</span>
            </div>

            <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>File Name</th>
                        <th>Folder</th>
                        <th>Size</th>
                        <th>Updated</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="fileTableBody">
                    <tr><td colspan="5" class="muted">Loading files...</td></tr>
                </tbody>
            </table>
            </div>
        </section>
        </div>
    </main>

    <script src="/common.js"></script>
    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const fileTableBody = document.getElementById('fileTableBody');
        const uploadStatus = document.getElementById('uploadStatus');
        const searchInput = document.getElementById('searchInput');
        const fileCount = document.getElementById('fileCount');
        const refreshBtn = document.getElementById('refreshBtn');
        const uploadPath = document.getElementById('uploadPath');
        const folderFilter = document.getElementById('folderFilter');
        const appHeader = document.getElementById('appHeader');
        const appContent = document.getElementById('appContent');
        const signedOutCard = document.getElementById('signedOutCard');
        let currentUser = null;
        // Option text collapses normal spaces, so nested folders are indented with no-break spaces.
        const folderIndent = '   ';
        let files = [];

        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('keydown', event => {
            if (event.key === 'Enter' || event.key === ' ') fileInput.click();
        });
        dropZone.addEventListener('dragover', event => {
            event.preventDefault();
            dropZone.classList.add('drag-over');
        });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
        dropZone.addEventListener('drop', event => {
            event.preventDefault();
            dropZone.classList.remove('drag-over');
            uploadFiles(event.dataTransfer.files);
        });
        fileInput.addEventListener('change', event => uploadFiles(event.target.files));
        searchInput.addEventListener('input', renderFiles);
        folderFilter.addEventListener('change', loadFilesSafely);
        refreshBtn.addEventListener('click', refresh);

        async function init() {
            currentUser = await loadCurrentUser();
            if (!currentUser) {
                signedOutCard.classList.remove('hidden');
                return;
            }

            renderAppHeader(appHeader, currentUser, 'files');
            appContent.classList.remove('hidden');
            await loadFolders();
            await loadFiles();
        }

        function isAdmin() {
            return Boolean(currentUser) && currentUser.role === 'Admin';
        }

        async function refresh() {
            try {
                await loadFolders();
            } catch (error) {
                setStatus(error instanceof ApiError ? error.message : 'Could not load folders.', 'error');
            }
            await loadFilesSafely();
        }

        async function loadFolders() {
            const folders = flattenTree(await apiFetch('/api/folders/tree', {}, handleUnauthorized));
            fillFolderSelect(uploadPath, folders, null);
            fillFolderSelect(folderFilter, folders, 'All top-level');
        }

        // Rebuilds a folder select with full paths indented by depth, keeping the current choice when it still exists.
        function fillFolderSelect(select, folders, allLabel) {
            const previous = select.value;
            select.replaceChildren();

            if (allLabel) {
                select.appendChild(createOption('', allLabel));
            }

            folders.forEach(folder => {
                select.appendChild(createOption(folder.path, folderIndent.repeat(folder.depth) + folder.path));
            });

            if ([...select.options].some(option => option.value === previous)) {
                select.value = previous;
            }
        }

        function createOption(value, text) {
            const option = document.createElement('option');
            option.value = value;
            option.textContent = text;
            return option;
        }

        function handleUnauthorized() {
            location.href = loginUrl('/');
        }

        async function uploadFiles(selectedFiles) {
            if (!selectedFiles || selectedFiles.length === 0) return;

            if (!uploadPath.value) {
                setStatus('Choose a folder to upload to.', 'error');
                return;
            }

            const formData = new FormData();
            formData.append('path', uploadPath.value);
            [...selectedFiles].forEach(file => formData.append('files', file));
            setStatus(`Uploading ${selectedFiles.length} file(s)...`);

            try {
                await apiFetch('/api/upload', { method: 'POST', body: formData }, handleUnauthorized);
                setStatus(`Uploaded ${selectedFiles.length} file(s).`, 'success');
                fileInput.value = '';
                await loadFilesSafely();
                setTimeout(() => uploadStatus.innerHTML = '', 3500);
            } catch (error) {
                setStatus(error instanceof ApiError ? error.message : 'Upload failed.', 'error');
            }
        }

        async function loadFiles() {
            const path = folderFilter.value;
            const url = path ? `/api/files?path=${encodeURIComponent(path)}` : '/api/files';
            files = await apiFetch(url, {}, handleUnauthorized);
            renderFiles();
        }

        async function loadFilesSafely() {
            try {
                await loadFiles();
            } catch (error) {
                files = [];
                const message = error instanceof ApiError ? error.message : 'Could not load files.';
                fileTableBody.innerHTML = `<tr><td colspan="5" class="muted">${escapeHtml(message)}</td></tr>`;
                fileCount.textContent = 'Error';
            }
        }

        function renderFiles() {
            const keyword = searchInput.value.trim().toLowerCase();
            const visibleFiles = files.filter(file => file.name.toLowerCase().includes(keyword));
            fileCount.textContent = `${visibleFiles.length} file(s)`;

            if (visibleFiles.length === 0) {
                fileTableBody.innerHTML = '<tr><td colspan="5" class="muted">No matching files.</td></tr>';
                return;
            }

            const canDelete = isAdmin();
            fileTableBody.innerHTML = visibleFiles.map(file => `
                <tr>
                    <td class="name">${escapeHtml(file.name)}</td>
                    <td><span class="badge">${escapeHtml(file.path)}</span></td>
                    <td class="muted">${formatSize(file.size)}</td>
                    <td class="muted">${new Date(file.modified).toLocaleString()}</td>
                    <td>
                        <div class="row-actions">
                            <a class="button" href="${escapeAttr(downloadUrl(file))}">Download</a>
                            ${canDelete ? `<button type="button" class="danger" data-delete-path="${escapeAttr(file.path)}" data-delete-name="${escapeAttr(file.name)}">Delete</button>` : ''}
                        </div>
                    </td>
                </tr>
            `).join('');

            document.querySelectorAll('[data-delete-name]').forEach(button => {
                button.addEventListener('click', () => deleteFile(button.dataset.deletePath, button.dataset.deleteName));
            });
        }

        function downloadUrl(file) {
            return `/api/download?path=${encodeURIComponent(file.path)}&name=${encodeURIComponent(file.name)}`;
        }

        async function deleteFile(path, name) {
            if (!isAdmin()) {
                alert('Only admins can delete files.');
                return;
            }

            if (!confirm(`Delete file "${name}"?`)) return;

            try {
                await apiFetch(`/api/files?path=${encodeURIComponent(path)}&name=${encodeURIComponent(name)}`, { method: 'DELETE' }, handleUnauthorized);
            } catch (error) {
                if (error.status !== 401) alert(error instanceof ApiError ? error.message : 'Delete failed.');
                return;
            }

            await loadFilesSafely();
        }

        function setStatus(message, type) {
            uploadStatus.innerHTML = `<div class="status ${type || ''}">${escapeHtml(message)}</div>`;
        }

        init().catch(() => {
            fileTableBody.innerHTML = '<tr><td colspan="5" class="muted">Could not load files.</td></tr>';
            fileCount.textContent = 'Error';
        });
    </script>
</body>
</html>
