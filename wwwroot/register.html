<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register - Internal File Server</title>
    <link rel="stylesheet" href="/site.css">
</head>
<body>
    <main>
        <section class="card auth-card">
            <h1>Create an account</h1>
            <p class="subtitle">Register to browse, upload and download files.</p>
            <form id="registerForm" novalidate>
                <div class="form-row">
                    <label for="username">Username</label>
                    <input id="username" name="username" type="text" autocomplete="username" required>
                    <p id="usernameError" class="field-error" role="alert"></p>
                </div>
                <div class="form-row">
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" autocomplete="new-password" required>
                    <p id="passwordError" class="field-error" role="alert"></p>
                </div>
                <div class="form-row">
                    <label for="confirmPassword">Confirm password</label>
                    <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required>
                    <p id="confirmError" class="field-error" role="alert"></p>
                </div>
                <div id="formStatus"></div>
                <button type="submit" id="submitBtn">Register</button>
            </form>
            <p class="auth-switch">Already have an account? <a href="/login.html">Sign in</a></p>
        </section>
    </main>

    <script src="/common.js"></script>
    <script>
        const form = document.getElementById('registerForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const confirmInput = document.getElementById('confirmPassword');
        const usernameError = document.getElementById('usernameError');
        const passwordError = document.getElementById('passwordError');
        const confirmError = document.getElementById('confirmError');
        const formStatus = document.getElementById('formStatus');
        const submitBtn = document.getElementById('submitBtn');
        const usernamePattern = /^[A-Za-z0-9._-]{3,32}$/;
        const minPasswordLength = 8;
        const maxPasswordLength = 128;

        form.addEventListener('submit', submit);

        function setFormStatus(message) {
            formStatus.replaceChildren();
            if (!message) return;
            const box = document.createElement('div');
            box.className = 'status error';
            box.setAttribute('role', 'alert');
            box.textContent = message;
            formStatus.appendChild(box);
        }

        // Mirrors the server rules; returns true when the form may be sent.
        function validate() {
            const password = passwordInput.value;
            usernameError.textContent = usernamePattern.test(usernameInput.value)
                ? ''
                : 'Username must be 3-32 characters: letters, digits, dot, dash or underscore.';
            passwordError.textContent = password.length >= minPasswordLength && password.length <= maxPasswordLength
                ? ''
                : `Password must be ${minPasswordLength}-${maxPasswordLength} characters.`;
            confirmError.textContent = confirmInput.value === password ? '' : 'Passwords do not match.';
            return !usernameError.textContent && !passwordError.textContent && !confirmError.textContent;
        }

        async function submit(event) {
            event.preventDefault();
            setFormStatus('');
            if (!validate()) return;

            submitBtn.disabled = true;
            try {
                await apiFetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: usernameInput.value,
                        password: passwordInput.value,
                        confirmPassword: confirmInput.value
                    })
                });
                location.href = '/';
            } catch (error) {
                setFormStatus(error instanceof ApiError ? error.message : 'Could not register. Try again.');
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
